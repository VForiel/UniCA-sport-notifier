{% extends "base.html" %}

{% block title %}Déconnexion · UniCA Sport Notifier{% endblock %}

{% block content %}
<div class="entrance">
  <div class="page-head"><h1>Déconnexion</h1></div>
  <form method="post" action="{% url 'account_logout' %}" class="panel panel-body">
    {% csrf_token %}
    <p>Se déconnecter de UniCA Sport Notifier ?</p>
    <div class="actions">
      <a href="/" class="btn">Annuler</a>
      <button type="submit" class="btn primary">Se déconnecter</button>
    </div>
  </form>
</div>
{% endblock %}
