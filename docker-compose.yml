services:
  db:
    image: postgres:16-alpine
    container_name: unicasport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicasport_db}
      POSTGRES_USER: ${POSTGRES_USER:-unicasport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicasecret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unicasport} -d ${POSTGRES_DB:-unicasport_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unicasport_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: unicasport_web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-unicasport}:${POSTGRES_PASSWORD:-unicasecret}@db:5432/${POSTGRES_DB:-unicasport_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  worker:
    build: .
    container_name: unicasport_worker
    restart: unless-stopped
    command: celery -A config worker -l INFO -Q celery,notifications -c 2
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-unicasport}:${POSTGRES_PASSWORD:-unicasecret}@db:5432/${POSTGRES_DB:-unicasport_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media

  beat:
    build: .
    container_name: unicasport_beat
    restart: unless-stopped
    command: celery -A config beat -l INFO
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-unicasport}:${POSTGRES_PASSWORD:-unicasecret}@db:5432/${POSTGRES_DB:-unicasport_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: unicasport_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
