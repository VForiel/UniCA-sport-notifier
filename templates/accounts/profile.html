{% extends "base.html" %}

{% block title %}Mon Profil — UniCA Sport Notifier{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
  <div style="margin-bottom: 2rem;">
    <h1 style="font-size: 1.8rem; margin-bottom: 0.25rem;">Mon Profil</h1>
    <p style="color: #94a3b8; font-size: 0.95rem;">Informations de votre compte utilisateur.</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Adresse email</label>
      <input type="text" class="form-control" value="{{ user.email }}" readonly disabled>
    </div>

    <div class="form-group">
      <label class="form-label">Date d'inscription</label>
      <input type="text" class="form-control" value="{{ user.date_joined|date:'d/m/Y H:i' }}" readonly disabled>
    </div>

    <div class="form-group">
      <label class="form-label">Rôle</label>
      <input type="text" class="form-control" value="{% if user.is_superuser %}Superadministrateur{% elif user.is_staff %}Administrateur{% else %}Utilisateur standard{% endif %}" readonly disabled>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--md-sys-color-outline); margin: 2rem 0 1.5rem 0;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/accounts/password/change/" class="btn btn-outline" style="font-size: 0.85rem;">
        <span class="material-symbols-outlined">password</span> Changer de mot de passe
      </a>

      <a href="/accounts/delete/" class="btn btn-danger" style="font-size: 0.85rem;">
        <span class="material-symbols-outlined">person_remove</span> Supprimer mon compte
      </a>
    </div>
  </div>
</div>
{% endblock %}
